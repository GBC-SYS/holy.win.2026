<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>홀리윈 2026 전도 대상자</title>
  <link rel="icon" href="./assets/imgs/appIcon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/imgs/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/imgs/favicon-16.png">
  <link rel="apple-touch-icon" href="./assets/imgs/apple-touch-icon.png">
  <link rel="manifest" href="./assets/manifest.webmanifest">
  <meta name="theme-color" content="#e8622c">
  <link rel="stylesheet" href="./assets/css/init.css" />
  <link rel="stylesheet" href="./assets/css/entries.css" />
</head>
<body>

  <div class="container">

    <!-- ============ 리스트 화면 ============ -->
    <section id="screen-list" class="screen" aria-label="전도 대상자 리스트">
      <header class="header">
        <div class="header-row">
          <h1 class="title">전도 대상자</h1>
          <div class="header-actions">
            <div class="count-chip">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 21s-7.5-4.6-10-9.3C.4 8.2 2.4 4.5 6 4c2.2-.3 4 1 6 3.3C14 5 15.8 3.7 18 4c3.6.5 5.6 4.2 4 7.7-2.5 4.7-10 9.3-10 9.3z"/>
              </svg>
              <span id="count-text">-</span>
            </div>
            <button type="button" class="back-btn" id="btn-refresh" aria-label="새로고침">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                <path d="M21 3v5h-5"/>
                <path d="M3 21v-5h5"/>
              </svg>
            </button>
          </div>
        </div>
        <p class="subtitle">함께 기도해요 · 홀리윈 전도 대상자</p>
        <div class="filter-tabs" role="tablist" aria-label="명단 필터">
          <button type="button" class="filter-tab filter-tab--active" id="filter-tab-all" role="tab" aria-selected="true">전체</button>
          <button type="button" class="filter-tab" id="filter-tab-mine" role="tab" aria-selected="false">내가 쓴 글</button>
        </div>
      </header>

      <div class="list-scroll">
        <div id="group-recent">
          <p class="group-label">이번 주 제출</p>
          <div class="group-list" id="list-recent"></div>
        </div>
        <div id="group-past">
          <p class="group-label group-label--dim">이전 명단</p>
          <div class="group-list" id="list-past"></div>
        </div>
        <p class="list-empty is-hidden" id="list-empty">아직 작성한 글이 없어요</p>
      </div>

      <footer class="cta-bar">
        <button type="button" class="cta-btn" id="btn-add">
          <span class="cta-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </span>
          <span class="cta-text">
            <strong>전도 대상자</strong>
            <span>이름 올리기</span>
          </span>
        </button>
        <button type="button" class="qr-btn" id="btn-qr-share" aria-label="QR 코드로 공유">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
            <path d="M14 14h3v3h-3M14 20h3M20 14v3M20 20h.01"/>
          </svg>
        </button>
      </footer>
    </section>

    <!-- ============ 상세(티켓) 화면 ============ -->
    <section id="screen-ticket" class="screen screen--hidden" aria-label="전도 티켓 상세">
      <div class="ticket-hero">
        <div class="topbar">
          <button type="button" class="back-btn" id="btn-back" aria-label="목록으로">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <span class="topbar-title">전도 대상자</span>
          <svg class="ticket-leaf" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21s-7.5-4.6-10-9.3C.4 8.2 2.4 4.5 6 4c2.2-.3 4 1 6 3.3C14 5 15.8 3.7 18 4c3.6.5 5.6 4.2 4 7.7-2.5 4.7-10 9.3-10 9.3z"/>
          </svg>
        </div>

        <div class="ticket-head">
          <h2 class="ticket-name" id="t-to">-</h2>
          <div class="ticket-from">
            <span id="t-from">-</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            <span>가 함께 기도하고 있어요</span>
          </div>
        </div>
      </div>

      <div class="ticket-wrap">
        <div class="ticket">
          <div class="ticket-grid">
            <div>
              <p class="grid-label">관계</p>
              <p class="grid-value" id="t-relation">-</p>
            </div>
            <div>
              <p class="grid-label">제출일</p>
              <p class="grid-value" id="t-date">-</p>
            </div>
            <div>
              <p class="grid-label">제출자</p>
              <p class="grid-value" id="t-from2">-</p>
            </div>
            <div>
              <p class="grid-label">상태</p>
              <p class="grid-value" id="t-status">-</p>
            </div>
          </div>

          <div class="ticket-perf"></div>

          <div class="stamp-wrap">
            <svg width="128" height="128" viewBox="0 0 128 128" class="stamp" id="t-stamp">
              <defs>
                <path id="stampArc" d="M 64 20 A 44 44 0 1 1 63.9 20"/>
              </defs>
              <circle class="stamp-ring stamp-ring--outer" cx="64" cy="64" r="58" fill="none" stroke="currentColor" stroke-width="2"/>
              <circle class="stamp-ring stamp-ring--inner" cx="64" cy="64" r="52" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3"/>
              <text class="stamp-arc-text" font-family="'Pretendard',sans-serif" font-size="9.5" font-weight="700" letter-spacing="2.5" fill="currentColor">
                <textPath href="#stampArc" startOffset="0%">HOLY · WIN · 2026 · HOLY · WIN · 2026 ·</textPath>
              </text>
              <svg class="stamp-icon" width="26" height="26" x="51" y="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.2 2.4 4.5 6 4c2.2-.3 4 1 6 3.3C14 5 15.8 3.7 18 4c3.6.5 5.6 4.2 4 7.7-2.5 4.7-10 9.3-10 9.3z"/></svg>
              <text id="t-stamp-status" x="64" y="86" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="13" font-weight="900" fill="currentColor" letter-spacing="1">기도 중</text>
            </svg>
          </div>
        </div>

        <p class="ticket-footnote">
          이 이름을 위해 함께 기도해요
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c0-7-4-10-8-10 0 6 3 9 8 10zm0 0c0-7 4-10 8-10 0 6-3 9-8 10z"/></svg>
        </p>

        <div class="ticket-owner-actions ticket-owner-actions--hidden" id="ticket-owner-actions">
          <button type="button" class="btn-danger" id="btn-delete-entry">삭제</button>
          <button type="button" class="btn-secondary" id="btn-edit-entry">수정</button>
        </div>
      </div>
    </section>

    <!-- ============ 명단 등록 바텀시트 ============ -->
    <div class="sheet-backdrop sheet-backdrop--hidden" id="sheet-backdrop"></div>

    <div class="sheet-panel sheet-panel--hidden" id="sheet-panel" role="dialog" aria-modal="true" aria-label="전도 대상자 등록">
      <div class="sheet-handle"></div>

      <div class="sheet-header">
        <span class="topbar-title">명단 등록</span>
        <button type="button" class="back-btn" id="btn-form-close" aria-label="닫기">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <form class="form-wrap" id="entry-form">
        <div class="form-field">
          <label class="form-label" for="input-to-name">대상자 이름</label>
          <input class="form-input" type="text" id="input-to-name" name="to_name" maxlength="50" required autocomplete="off">
        </div>
        <div class="form-field">
          <label class="form-label" for="input-from-name">제출자 이름</label>
          <input class="form-input" type="text" id="input-from-name" name="from_name" maxlength="50" required autocomplete="off">
        </div>
        <div class="form-field">
          <label class="form-label" for="input-relation">관계</label>
          <input class="form-input" type="text" id="input-relation" name="relation" maxlength="50" required autocomplete="off">
        </div>

        <button type="submit" class="cta-btn form-submit-btn">등록하기</button>
      </form>
    </div>

    <!-- ============ 명단 수정 바텀시트 ============ -->
    <div class="sheet-backdrop sheet-backdrop--hidden" id="edit-sheet-backdrop"></div>

    <div class="sheet-panel sheet-panel--hidden" id="edit-sheet-panel" role="dialog" aria-modal="true" aria-label="전도 대상자 수정">
      <div class="sheet-handle"></div>

      <div class="sheet-header">
        <span class="topbar-title">명단 수정</span>
        <button type="button" class="back-btn" id="btn-edit-form-close" aria-label="닫기">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <form class="form-wrap" id="edit-entry-form">
        <div class="form-field">
          <label class="form-label" for="edit-input-to-name">대상자 이름</label>
          <input class="form-input" type="text" id="edit-input-to-name" name="to_name" maxlength="50" required autocomplete="off">
        </div>
        <div class="form-field">
          <label class="form-label" for="edit-input-from-name">제출자 이름</label>
          <input class="form-input" type="text" id="edit-input-from-name" name="from_name" maxlength="50" required autocomplete="off">
        </div>
        <div class="form-field">
          <label class="form-label" for="edit-input-relation">관계</label>
          <input class="form-input" type="text" id="edit-input-relation" name="relation" maxlength="50" required autocomplete="off">
        </div>

        <button type="submit" class="cta-btn form-submit-btn">저장하기</button>
      </form>
    </div>

    <!-- ============ QR 코드 공유 바텀시트 ============ -->
    <div class="sheet-backdrop sheet-backdrop--hidden" id="qr-sheet-backdrop"></div>

    <div class="sheet-panel sheet-panel--hidden" id="qr-sheet-panel" role="dialog" aria-modal="true" aria-label="QR 코드로 공유">
      <div class="sheet-handle"></div>

      <div class="sheet-header">
        <span class="topbar-title">QR코드로 공유</span>
        <button type="button" class="back-btn" id="btn-qr-close" aria-label="닫기">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="qr-sheet-body">
        <div class="qr-card">
          <canvas id="qr-canvas"></canvas>
        </div>
        <p class="qr-caption" id="qr-caption">카메라로 스캔하면 전도 대상자로 연결돼요</p>
        <p class="qr-url" id="qr-url-text">-</p>
        <div class="qr-actions">
          <button type="button" class="cta-btn" id="btn-qr-save">이미지로 저장</button>
          <button type="button" class="btn-secondary is-hidden" id="btn-qr-install">📲 홈 화면에 추가</button>
        </div>
      </div>
    </div>

    <!-- ============ 알림/확인 다이얼로그 ============ -->
    <div class="sheet-backdrop sheet-backdrop--hidden" id="dialog-backdrop"></div>

    <div class="dialog-panel dialog-panel--hidden" id="dialog-panel" role="alertdialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-description">
      <p class="dialog-title" id="dialog-title"></p>
      <p class="dialog-description" id="dialog-description"></p>
      <div class="dialog-actions">
        <button type="button" class="cta-btn dialog-confirm-btn" id="dialog-confirm-btn">확인</button>
        <button type="button" class="btn-secondary dialog-cancel-btn" id="dialog-cancel-btn">취소</button>
      </div>
    </div>

  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<!-- QR Code 라이브러리 -->
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js" integrity="sha384-HGmnkDZJy7mRkoARekrrj0VjEFSh9a0Z8qxGri/kTTAJkgR8hqD1lHsYSh3JdzRi" crossorigin="anonymous"></script>
<script src="./assets/js/supabase-client.js"></script>
<script src="./assets/js/install-prompt.js"></script>
<script src="./assets/js/entries.js"></script>
</body>
</html>
