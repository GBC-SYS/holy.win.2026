## 표준 RBAC 테이블 구조

기본 테이블 구성:

- `roles` — 역할 정의 (name, description)
- `permissions` — 권한 정의 (resource, action)
- `role_permissions` — 역할-권한 매핑 (junction table)
- `user_roles` — 사용자-역할 매핑 (profiles.id 참조)

필요에 따라 확장:

- `resource_policies` — 리소스별 세부 정책
- `permission_conditions` — 조건부 권한

